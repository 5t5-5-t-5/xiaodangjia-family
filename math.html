<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="数学大作战">
<link rel="apple-touch-icon" href="icon-math.png">
<title>数学大作战</title>
<style>
:root{
  --bg:#FBF7F0; --ink:#1F2B57; --soft:#7A86A8; --line:#ECE4D6;
  --blue:#3B82F6; --blueL:#E3EEFF; --green:#22B573; --greenL:#DDF5E9;
  --orange:#FF8A1F; --orangeL:#FFEBD6; --red:#F2545B; --redL:#FDE2E3;
  --yellow:#FFC93C; --yellowL:#FFF4D1; --purple:#8B5CF6; --purpleL:#EEE7FF;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600}
body{min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;overflow-x:hidden;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
svg{display:block;width:100%;height:100%;overflow:visible}
.scr{min-height:100vh;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 24px max(18px,env(safe-area-inset-bottom))}
.back{font-size:20px;font-weight:800;color:var(--soft);padding:6px 4px}

/* ---------- 首页 ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{margin:0;font-size:30px;font-weight:900;flex:1;letter-spacing:.02em}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:17px}
.hero{border-radius:28px;padding:18px 28px;display:flex;gap:22px;align-items:center;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#FFB347 0%,#FF8A1F 55%,#F2662B 100%);color:#fff}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:260px;height:260px;border-radius:50%;background:#ffffff22}
.hero .pic{width:170px;height:200px;flex:none;filter:drop-shadow(0 6px 0 #00000022);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hero small{display:block;font-size:22px;font-weight:800;opacity:.92}
.hero b{display:block;font-size:52px;font-weight:900;margin:2px 0 10px;letter-spacing:.04em;text-shadow:0 3px 0 #C2410C}
.go{background:#fff;color:#F2662B;font-size:30px;font-weight:900;border-radius:999px;padding:14px 46px;box-shadow:0 6px 0 #C2410C;position:relative;z-index:1}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #C2410C}
.sec{margin:20px 0 10px;font-size:22px;font-weight:900;display:flex;align-items:baseline;gap:10px}
.sec span{font-size:14px;color:var(--soft);font-weight:600}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.node{background:#fff;border-radius:20px;padding:8px 6px 10px;text-align:center;position:relative}
.node .pic{width:74px;height:84px;margin:0 auto}
.node b{display:block;font-size:17px;margin-top:2px}
.node .num{position:absolute;left:10px;top:6px;font-size:22px;font-weight:900;color:var(--orange);z-index:1}
.node .num.w{font-size:14px;top:8px}
.node .dots{display:flex;gap:3px;justify-content:center;margin-top:5px;min-height:10px}
.node .dots u{width:10px;height:10px;border-radius:3px;background:var(--line)}
.dots u.g{background:var(--green)} .dots u.y{background:var(--yellow)} .dots u.r{background:var(--red)}
.node.lock{background:#F1ECE3}
.node.lock .pic{filter:grayscale(1) brightness(1.15);opacity:.35}
.node.lock b{color:#B8B0A2}
.node.lock .num{color:#CFC7B8}
.node.on{outline:4px solid var(--orange)}
.node.done::after{content:"✓";position:absolute;right:8px;top:4px;font-size:22px;color:var(--green);font-weight:900}
.album{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.card{flex:none;width:104px;height:138px;border-radius:16px;background:linear-gradient(#FFF6D6,#FFE7A0);border:3px solid #E7B53C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.card .pic{width:78px;height:92px}
.card b{font-size:15px}
.card.none{background:#fff;border:3px dashed var(--line);color:#C9C1B3;font-size:34px}
.parent{margin-top:18px;background:#fff;border-radius:18px;padding:14px 16px}
.parent summary{font-weight:800;font-size:17px;cursor:pointer;list-style:none}
.parent summary::-webkit-details-marker{display:none}
.grid{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.grow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow>b{width:26px;font-size:20px;color:var(--orange)}
.cell{border-radius:10px;padding:6px 9px;font-size:14px;font-weight:700;background:var(--line);color:#8A8272}
.cell.g{background:var(--greenL);color:#13804F} .cell.y{background:var(--yellowL);color:#9A6B00} .cell.r{background:var(--redL);color:#C0262E}
.legend{font-size:13px;color:var(--soft);margin-top:10px;line-height:1.7;font-weight:500}
.tiny{font-size:14px;color:var(--soft);text-decoration:underline;margin:10px 14px 0 0}

/* ---------- 战斗 ---------- */
.bhead{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:8px 18px 8px 10px}
.bhead .boss{width:76px;height:86px;flex:none;position:relative}
.bhead .boss.hurt{animation:hurt .45s}
@keyframes hurt{0%,100%{transform:none;filter:none}15%{transform:translateX(-8px) rotate(-6deg);filter:brightness(2) saturate(.3)}45%{transform:translateX(8px) rotate(6deg)}70%{transform:translateX(-4px)}}
.bhead .nm{font-weight:900;font-size:24px}
.hpw{flex:1}
.hp{height:22px;border-radius:999px;background:#3A2230;overflow:hidden;margin-top:6px;border:3px solid #2B2B3A;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#FF7A6E,#E0283A);transition:width .5s cubic-bezier(.3,1.4,.6,1)}
.hp em{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 2px),#2B2B3A55 calc(12.5% - 2px) 12.5%)}
.qno{font-weight:900;color:var(--soft);font-size:20px;white-space:nowrap}
.arena{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:14px;align-items:stretch}
.stage{border-radius:28px;min-height:540px;display:flex;align-items:center;justify-content:center;padding:18px;position:relative;overflow:hidden;border:4px solid #fff}
.side{display:flex;flex-direction:column;gap:14px}
.ask{background:#fff;border-radius:24px;padding:18px 20px}
.ask .t{font-size:34px;font-weight:900;line-height:1.3}
.ask .say{margin-top:10px;font-size:14px;color:var(--soft);line-height:1.5;font-weight:500}
.ask .say b{color:var(--orange)}
.spk{font-size:26px;margin-top:6px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pad button{border-radius:22px;font-size:46px;font-weight:900;height:92px;color:#fff;transition:transform .08s;
  background:linear-gradient(#5B9BFF,#3B6FE0);box-shadow:0 7px 0 #2848A8;text-shadow:0 2px 0 #2848A8}
.pad button:active{transform:translateY(5px);box-shadow:0 2px 0 #2848A8}
.pad button.ok{background:linear-gradient(#4FD68F,#1FA463);box-shadow:0 7px 0 #137A48;text-shadow:0 2px 0 #137A48}
.pad button.no{background:linear-gradient(#FFB3B6,#F2545B);box-shadow:0 7px 0 #B3262E;text-shadow:none;opacity:.6}
.fb{min-height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;padding:8px 14px}
.fb.ok{background:var(--greenL);color:#13804F}
.fb.no{background:var(--orangeL);color:#B85B00}
.next{background:linear-gradient(#FFA24A,#FF7A12);color:#fff;font-size:28px;font-weight:900;border-radius:999px;padding:16px;width:100%;box-shadow:0 7px 0 #C2410C}
.next:active{transform:translateY(5px);box-shadow:0 2px 0 #C2410C}

/* 场景背景 */
.bg-camp{background:linear-gradient(#BFE3FF 0%,#E6F4FF 52%,#E9D2A0 52%,#DDBF82 100%)}
.bg-camp::before{content:"";position:absolute;left:-10%;right:-10%;top:40%;height:16%;background:radial-gradient(60% 100% at 20% 100%,#9CC58A 98%,transparent),radial-gradient(50% 100% at 75% 100%,#86B574 98%,transparent)}
.bg-gym{background:radial-gradient(circle at 50% 45%,#5B3FA8,#2A1B58 70%)}
.bg-jungle{background:linear-gradient(#BFF0C8 0%,#E4F8D8 55%,#A5D67F 55%,#8CC466 100%)}
.bg-jungle::before{content:"";position:absolute;right:6%;top:14%;width:180px;height:150px;background:#7A6A5F;clip-path:polygon(0 100%,38% 12%,62% 12%,100% 100%);opacity:.5}
.bg-city{background:linear-gradient(#1E2A4F,#3A4E86)}
.bg-city::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#2B355C,#1B2240)}
.bg-sea{background:linear-gradient(#6EC6FF 0%,#2E7FD8 60%,#1B4F9C 100%)}
.bg-scroll{background:#F5E6C4;box-shadow:inset 0 0 0 12px #E2C88E}
.bg-army{background:linear-gradient(#D9EBC2,#B8D49A)}
.bubble{position:absolute;border-radius:50%;border:3px solid #ffffff88;animation:rise 4s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}20%{opacity:1}to{transform:translateY(-560px);opacity:0}}

/* 画面里的东西 */
.row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:flex-end}
.fig{width:84px;height:104px}
.camps{display:flex;gap:18px;align-items:stretch;justify-content:center;width:100%;position:relative;z-index:1}
.camp{flex:1;border-radius:24px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#ffffffaa;border:4px dashed transparent;min-height:250px;position:relative}
.camp.l{border-color:#3B82F688}.camp.r{border-color:#F28C2888}
.camp .tag{display:flex;align-items:center;gap:6px;font-size:28px;font-weight:900}
.camp .tag .flag{width:32px;height:48px}
.camp .tentbig{width:200px;height:170px;margin-top:6px}
.total{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 20px;font-size:26px;font-weight:900;z-index:2;white-space:nowrap}
.qbox{width:120px;height:120px;border-radius:28px;background:linear-gradient(#FFB347,#F2662B);color:#fff;font-size:72px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #C2410C;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.nbox{width:120px;height:120px;border-radius:28px;background:linear-gradient(#5B9BFF,#3B6FE0);color:#fff;font-size:72px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #2848A8}
.nbox.g{background:linear-gradient(#4FD68F,#1FA463);box-shadow:0 6px 0 #137A48}
.bar{display:flex;gap:8px;padding:12px;border-radius:22px;background:#1A1238;border:4px solid #FFE66D}
.bar i{width:72px;height:112px;border-radius:12px;background:#3A2E6B;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:42px}
.bar i.f{background:linear-gradient(#FFF1A6,#FFC21A);box-shadow:0 0 22px #FFD23F}
.bar i.add{background:linear-gradient(#C5F3FF,#3BB4FF);box-shadow:0 0 22px #7FE3FF}
.goku{width:190px;height:220px;margin:0 auto 6px}
.aura{animation:aura .6s ease-in-out infinite alternate}
@keyframes aura{to{filter:drop-shadow(0 0 18px #FFE66D) drop-shadow(0 0 30px #FFD23F)}}
.dino{width:120px;height:104px}
.rockw{position:relative;width:300px;height:220px}
.rockw .rk{position:absolute;inset:0}
.rockw .tail{position:absolute;left:-22px;bottom:30px;width:90px;height:70px;transform:scaleX(-1)}
.rockw .q{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:84px;font-weight:900;color:#fff;text-shadow:0 4px 0 #6E6862}
.bot{width:96px;height:120px}
.plus{font-size:64px;font-weight:900;color:#fff;text-shadow:0 4px 0 #0005}
.letterw{width:200px;height:150px}
.jf{width:180px;height:220px}
.sea{position:absolute;inset:0}
.sea span{position:absolute;width:150px;height:90px;transition:opacity .25s}
.sea span.tall{width:96px;height:120px}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:34px;font-weight:900;color:#fff;background:#1B4F9Cdd;z-index:3;border-radius:22px}
.cover b{font-size:90px}
.pop{animation:pop .4s both}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.peek{animation:peek .5s both}
@keyframes peek{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}

/* ---------- 打击特效 ---------- */
.slash{position:fixed;pointer-events:none;z-index:50;width:220px;height:220px}
.slash svg{animation:slash .45s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:scale(.4) rotate(-30deg)}30%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(10deg)}}
.dmg{position:fixed;z-index:51;pointer-events:none;font-size:44px;font-weight:900;color:#fff;-webkit-text-stroke:3px #B3262E;animation:dmg 1s ease-out forwards}
@keyframes dmg{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-80px) scale(1);opacity:0}}
.critfx{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center}
.critfx .flash{position:absolute;inset:0;background:#fff;animation:fl .35s ease-out forwards}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.critfx .rays{position:absolute;width:900px;height:900px;border-radius:50%;
  background:repeating-conic-gradient(#FFD23F 0 8deg,transparent 8deg 22deg);animation:rays 1.1s ease-out forwards;
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%)}
@keyframes rays{0%{transform:scale(.2) rotate(0);opacity:0}25%{opacity:1}100%{transform:scale(1.2) rotate(40deg);opacity:0}}
.critfx .word{position:relative;font-size:150px;font-weight:900;letter-spacing:.06em;color:#FFE14D;
  -webkit-text-stroke:8px #B3262E;paint-order:stroke fill;text-shadow:0 10px 0 #7A1020;animation:word 1.1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes word{0%{transform:scale(3) rotate(-12deg);opacity:0}25%{transform:scale(.9) rotate(-6deg);opacity:1}40%{transform:scale(1.05) rotate(-6deg)}85%{opacity:1}100%{transform:scale(1.1) rotate(-6deg);opacity:0}}
.critfx .spark{position:absolute;width:18px;height:18px;border-radius:4px;background:#FFD23F;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-14px,6px)}25%{transform:translate(12px,-8px)}40%{transform:translate(-10px,4px)}60%{transform:translate(8px,-4px)}80%{transform:translate(-4px,2px)}}

/* ---------- 你来出题（拖小兵） ---------- */
.rev .head{display:flex;align-items:center;gap:16px}
.rev h2{font-size:40px;margin:0;font-weight:900}
.rev .step{font-size:30px;font-weight:900;color:var(--purple);margin:6px 0 10px}
.pick{display:flex;gap:12px}
.pick button{width:84px;height:84px;border-radius:22px;font-size:46px;font-weight:900;color:#fff;background:linear-gradient(#A98BFF,#7C4DFF);box-shadow:0 6px 0 #5530C8}
.pick button.on{background:linear-gradient(#FFD23F,#F2A60C);box-shadow:0 6px 0 #B97A00}
.field{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;margin-top:16px;align-items:stretch}
.zone{border-radius:26px;min-height:330px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;transition:transform .15s,box-shadow .15s}
.zone .lab{font-size:28px;font-weight:900;display:flex;align-items:center;gap:6px}
.zone .lab .flag{width:30px;height:46px}
.zone .slots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:flex-end;flex:1;align-content:flex-start;min-height:120px}
#zl{background:#E3EEFF;border:4px dashed #3B82F6}
#zr{background:#FFEBD6;border:4px dashed #F28C28}
#zp{background:#EFE6D2;border:4px solid #D8C7A2}
.zone.hot{transform:scale(1.03);box-shadow:0 0 0 6px #FFD23F}
.zone .fig{width:92px;height:114px;touch-action:none;cursor:grab}
.zone .tentcover{position:absolute;inset:56px 10px 10px;display:flex;align-items:center;justify-content:center}
.zone .tentcover .t{width:100%;height:100%}
.zone .tentcover b{position:absolute;font-size:80px;color:#fff;text-shadow:0 4px 0 #9A5A12;top:44%}
.ghost{position:fixed;z-index:80;width:96px;height:118px;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 10px 8px #0004)}
.revbar{display:flex;gap:14px;margin-top:16px}
.revbar button{flex:1;border-radius:22px;padding:18px;font-size:34px;font-weight:900;color:#fff}
.b-go{background:linear-gradient(#FFA24A,#FF7A12);box-shadow:0 7px 0 #C2410C}
.b-y{background:linear-gradient(#4FD68F,#1FA463);box-shadow:0 7px 0 #137A48}
.b-n{background:linear-gradient(#FF8A8F,#E0283A);box-shadow:0 7px 0 #9A1A28}
.revq{font-size:38px;font-weight:900;text-align:center;margin-top:14px}

/* ---------- 胜利 ---------- */
.win{text-align:center}
.win .fall{width:120px;height:136px;margin:0 auto;animation:fall 1.2s ease-in forwards}
@keyframes fall{0%{transform:none}30%{transform:rotate(-10deg)}100%{transform:translateY(40px) rotate(80deg);opacity:.25;filter:grayscale(1)}}
.win .big{font-size:48px;font-weight:900;margin:0;color:#F2662B;text-shadow:0 4px 0 #FFD9B0}
.stats{display:flex;gap:12px;justify-content:center;margin:8px 0 10px}
.stats div{background:#fff;border-radius:18px;padding:10px 20px;font-weight:900;font-size:28px}
.newcard{margin:8px auto;width:200px;height:256px;border-radius:26px;background:linear-gradient(#FFF6D6,#FFE08A);border:6px solid #E7B53C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:flip 1s .6s both;box-shadow:0 0 40px #FFD23F99}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.newcard .pic{width:150px;height:176px}
.newcard b{font-size:32px}
.teaser{display:inline-flex;align-items:center;gap:10px;background:var(--purpleL);color:#5B34C9;border-radius:20px;padding:8px 22px;font-weight:900;font-size:26px;margin:8px auto 16px}
.teaser .pic{width:48px;height:56px}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:70;pointer-events:none;animation:conf 2.6s linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}

/* 名字 */
.dlg{position:fixed;inset:0;background:#1F2B57aa;z-index:90;display:flex;align-items:center;justify-content:center}
.dlg>div{background:#fff;border-radius:28px;padding:28px;width:min(440px,92vw);text-align:center}
.dlg h3{margin:0 0 6px;font-size:28px}
.dlg p{margin:0 0 14px;color:var(--soft);font-size:15px;font-weight:500}
.dlg input{width:100%;font-size:30px;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:16px;padding:10px;font-family:inherit;color:var(--ink)}
.dlg button{margin-top:14px}

/* 竖着拿 iPad */
@media (max-width:900px){
  .arena{grid-template-columns:1fr}
  .stage{min-height:460px}
  .map{grid-template-columns:repeat(4,1fr)}
  .field{grid-template-columns:1fr 1fr}
  #zp{grid-column:1/-1;min-height:200px;order:-1}
}
</style>
</head>
<body>

<!-- 首页 -->
<section class="scr" id="home">
  <div class="top"><h1>⚔️ 数学大作战</h1><span class="pill" id="streak"></span></div>
  <div class="hero">
    <div class="pic" id="hPic"></div>
    <div>
      <small id="hSub"></small>
      <b id="hName"></b>
      <button class="go" id="goBtn">⚔️ 开战！</button>
    </div>
  </div>
  <div class="sec">🗺️ 地图 <span>（家长：小方块 绿=会了 黄=慢 红=错过）</span></div>
  <div class="map" id="map"></div>
  <div class="sec">🃏 卡片 <span id="albumN"></span></div>
  <div class="album" id="album"></div>
  <details class="parent">
    <summary>👨‍👩‍👦 家长看这里：哪块熟、哪块还缺</summary>
    <div class="grid" id="grid"></div>

<script src="art.js?v=20261113c"></script>
<script>

/* 主屏幕会缓存旧页面：每次打开都看一下网上有没有新版本，有就换上 */

/* ---------- 记录（先存在这台 iPad 上） ---------- */

function record(k,r){const h=stats[k]||[];h.push(r);stats[k]=h.slice(-6);save("stats",stats)}
const numDone=n=>pairsOf(n).every(k=>status(k)==="g");
function focusLevel(){for(const l of LEVELS){if(l.lock)break;if(!numDone(l.n))return l}return LEVELS.filter(l=>!l.lock).pop()}

/* ---------- 声音 ---------- */
let AC=null;const ac=()=>(AC=AC||new (window.AudioContext||window.webkitAudioContext)());

function noise(d,v=.3,delay=0,hp=800){try{const c=ac(),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type="highpass";f.frequency.value=hp;s.buffer=b;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+delay)}catch(e){}}
const sndHit=()=>{noise(.18,.35,0,1500);tone(320,.18,"square",.12,0,90)};
const sndCrit=()=>{noise(.35,.5,0,400);tone(110,.5,"sawtooth",.18,0,40);tone(880,.25,"square",.1,.05,1760);[523,784,1047].forEach((f,i)=>tone(f,.35,"triangle",.14,.12+i*.07))};
const sndNo=()=>{tone(300,.18,"sine",.12);tone(220,.3,"sine",.1,.15)};
const sndPick=()=>tone(700,.07,"triangle",.12);
const sndDrop=()=>{tone(420,.08,"square",.08);tone(630,.1,"triangle",.1,.05)};
const sndWin=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,"triangle",.15,i*.12));noise(.6,.15,.6,3000)};
let zhVoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/zh[-_]CN/i.test(v.lang));zhVoice=vs.find(v=>/Tingting|婷婷|Lili|莉莉/.test(v.name))||vs[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,done){

  const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=1.04;u.pitch=1.1;if(zhVoice)u.voice=zhVoice;
  let fired=false;const fin=()=>{if(!fired){fired=true;done&&done()}};
  u.onend=fin;u.onerror=fin;setTimeout(fin,Math.min(5000,700+t.length*180));

}
const hush=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* ---------- 首页 ---------- */
function show(id){for(const s of["home","battle","rev","win"])$("#"+s).hidden=s!==id;scrollTo(0,0)}
function drawHome(){
  const f=focusLevel();
  $("#hPic").innerHTML=art(f.art);$("#hName").textContent=f.name;$("#hSub").textContent=`第 ${f.n} 关`;
  $("#streak").textContent=days.includes(new Date().toDateString())?"✅ 今天打过了":`🔥 ${days.length} 天`;
  $("#map").innerHTML=LEVELS.map(l=>{

    return `<button class="node ${l.lock?"lock":""} ${l===f?"on":""} ${num&&numDone(l.n)?"done":""}" data-n="${l.n}" ${l.lock?"disabled":""}>
      <span class="num ${typeof l.n==="number"?"":"w"}">${l.n}</span><div class="pic">${art(l.art)}</div><b>${l.lock?"🔒":l.name}</b><div class="dots">${dots}</div></button>`}).join("");
  $("#albumN").textContent=`${cards.length} 张`;
  $("#album").innerHTML=cards.map(n=>{const c=CARDS.find(x=>x[1]===n);return`<div class="card"><div class="pic">${c?art(c[0]):""}</div><b>${n}</b></div>`}).join("")+`<div class="card none">?</div>`;

    `<div class="grow"><b>${l.n}</b>${l.lock?`<span class="cell">🔒 还没解锁</span>`:pairsOf(l.n).map(k=>`<span class="cell ${status(k)}">${k.split(":")[1]}</span>`).join("")+`<span class="cell ${status("看"+l.n)}">一眼看出${l.n}</span>`}</div>`).join("");
}

$("#resetBtn").addEventListener("click",()=>{if(!confirm("清空所有练习记录和卡片吗？"))return;stats={};cards=[];days=[];save("stats",stats);save("cards",cards);save("days",days);drawHome()});
function askName(){$("#nameIn").value=KID;$("#nameDlg").hidden=false;setTimeout(()=>$("#nameIn").focus(),100)}
$("#nameBtn").addEventListener("click",askName);

/* ---------- 出题 ---------- */
const MODES=["tree","split","energy","hide","merge","flash","riddle"];
const weightOf=k=>{const s=status(k);return s==="r"?5:s==="y"?3:s===""?3:1};
function buildQuestions(lv){
  const nums=[];for(let n=2;n<=Math.max(lv.n,4);n++)if(n<=lv.n||lv.n<=3)nums.push(n);
  const pool=[];
  for(const n of nums)for(let a=1;a<n;a++){let w=weightOf(pairKey(n,a));if(n===lv.n)w*=3;for(let i=0;i<w;i++)pool.push([n,a])}
  const modes=shuffle(MODES).concat(shuffle(MODES));const qs=[];let g=0;
  while(qs.length<8&&g++<300){
    const [n,a]=pick(pool);let mode=modes[qs.length];
    if(qs.length&&qs[qs.length-1].mode===mode)mode=pick(MODES.filter(m=>m!==mode));
    if(qs.some(q=>q.n===n&&q.a===a&&q.mode===mode))continue;
    if(g<150&&qs.length&&qs[qs.length-1].n===n&&qs[qs.length-1].a===a)continue;
    qs.push(makeQ(mode,n,a));
  }
  return qs;
}
function makeQ(mode,n,a){
  const b=n-a,k=pairKey(n,a);
  switch(mode){
    case"tree":return{mode,n,a,b,k,ans:b,t:`${n} 分成 ${a} 和 ？`,sayT:`${n}可以分成${a}和几？`,tip:`伸出 ${n} 根手指，弯下 ${a} 根，还剩几根？`};
    case"split":{const g=pick(["刘备","关羽","张飞"]);return{mode,n,a,b,k,ans:b,g,t:`左边 ${a} 个，右边几个？`,sayT:`${g}带了${n}个兵，左边${a}个，右边几个？`,tip:`一起数一数：一共 ${n} 个，左边 ${a} 个……`}}
    case"energy":return{mode,n,a,b,k,ans:b,t:`还要几个 ⚡ ？`,sayT:`悟空的能量有${n}格，亮了${a}格，还要几格才能变身？`,tip:`看看暗的格子，有几格还没亮？`};
    case"hide":return{mode,n,a,b,k,ans:b,d:pick(["bawanglong","sanjiaolong"]),t:`🪨 后面有几只？`,sayT:`一共${n}只恐龙，看得见${a}只，石头后面藏了几只？`,tip:`${a} 和几合起来是 ${n}？用手指试试。`};
    case"merge":return{mode,n,a,b,k,ans:n,t:`一共几个？`,sayT:`${a}个擎天柱和${b}个大黄蜂集合，一共几个汽车人？`,tip:`先记住 ${a}，再接着往下数 ${b} 个。`};
    case"riddle":return{mode,n,a,b,k,ans:n,t:`${a} 和 ${b} 是几？`,sayT:`解放军侦察兵送来密信：${a}和${b}合起来是几？`,tip:`${a} 和 ${b} 合在一起，摆出来数一数。`};
    case"flash":return{mode,n,a,b,k:"看"+n,ans:n,s:pick(["mxj","wuzei","shayu","haitun"]),t:`有几只？`,sayT:`不许数，一眼看，有几只？`,tip:`再看一次，试试把它们分成两小堆来看。`};
  }
}
const BG={tree:"bg-scroll",split:"bg-camp",energy:"bg-gym",hide:"bg-jungle",merge:"bg-city",flash:"bg-sea",riddle:"bg-army"};
const rep=(h,n)=>Array.from({length:n},(_,i)=>h(i)).join("");
function stageHTML(q,reveal){

  switch(q.mode){
    case"tree":return`<div class="pop" style="display:flex;flex-direction:column;align-items:center">

      <svg viewBox="0 0 300 90" style="width:300px;height:90px"><path d="M150 4 L60 86 M150 4 L240 86" stroke="#8A5A33" stroke-width="10" stroke-linecap="round"/></svg>
      <div style="display:flex;gap:110px"><div class="nbox">${a}</div>${reveal?`<div class="nbox g pop">${b}</div>`:`<div class="qbox">?</div>`}</div></div><div style="position:absolute;left:18px;bottom:14px;width:120px;height:140px">${B?art(B.lv.art):""}</div>`;

      <div class="row" style="max-width:300px">${rep(()=>`<div class="bot">${art("qingtianzhu")}</div>`,a)}</div><span class="plus">+</span>
      <div class="row" style="max-width:300px">${rep(()=>`<div class="bot">${art("dahuangfeng")}</div>`,b)}</div>
      <span class="plus">=</span>${reveal?`<div class="nbox g pop">${n}</div>`:`<div class="qbox">?</div>`}</div>`;
    case"riddle":return`<div class="pop" style="display:flex;align-items:center;gap:20px">

  }
}
function placeSea(q){
  const sea=$("#sea");if(!sea)return;const W_=sea.clientWidth,H=sea.clientHeight,tall=q.s==="wuzei",w=tall?96:150,h=tall?120:90;
  const pts=[];let g=0;
  while(pts.length<q.n&&g++<2000){const x=16+Math.random()*(W_-w-32),y=16+Math.random()*(H-h-32);if(pts.every(p=>Math.abs(p[0]-x)>w*.95||Math.abs(p[1]-y)>h*.95))pts.push([x,y])}
  sea.innerHTML=pts.map(p=>`<span class="${tall?"tall":""}" style="left:${p[0]}px;top:${p[1]}px;${Math.random()<.5&&!tall?"transform:scaleX(-1)":""}">${art(q.s)}</span>`).join("");
}
function bubbles(){return rep(i=>`<span class="bubble" style="left:${8+rnd(84)}%;bottom:-20px;width:${10+rnd(18)}px;height:${10+rnd(18)}px;animation-delay:${(i*.7).toFixed(1)}s"></span>`,6)}

/* ---------- 战斗 ---------- */
let B=null;
function startBattle(lv){
  if(!KID){askName();return}
  B={lv,qs:buildQuestions(lv),i:0,fast:0,slow:0,wrong:0};
  $("#bBoss").innerHTML=art(lv.art);$("#bName").textContent=lv.name;
  show("battle");hpDraw();
  $("#stage").className="stage bg-camp";
  $("#stage").innerHTML=`<div class="pop" style="width:280px;height:330px">${art(lv.art)}</div>`;
  $("#askT").textContent=`${lv.name} 来了！`;$("#askSay").textContent="";$("#pad").innerHTML="";$("#fb").hidden=true;$("#nextBtn").hidden=true;$("#qno").textContent="";
  tone(196,.4,"sawtooth",.08);tone(147,.6,"sawtooth",.08,.3);
  say(`${lv.name}来了！${kid()}，开战！`,()=>ask());
}
function hpDraw(){$("#hp").style.width=Math.max(0,100-100*B.i/(B.qs.length+1))+"%"}
function ask(){
  const q=B.qs[B.i];q.tries=0;q.done=false;q.t0=0;
  hpDraw();$("#qno").textContent=`${B.i+1}/${B.qs.length}`;
  $("#fb").hidden=true;$("#nextBtn").hidden=true;
  $("#askT").textContent=q.t;
  $("#askSay").innerHTML=`家长：念完题让${kid()}<b>不掰手指</b>直接说或点数字。答错了就照着做：${q.tip}`;
  $("#pad").innerHTML=Array.from({length:Math.max(5,q.ans)},(_,i)=>`<button data-v="${i+1}">${i+1}</button>`).join("");
  const st=$("#stage");st.className="stage "+BG[q.mode];
  if(q.mode==="flash"){
    $("#pad").style.pointerEvents="none";
    st.innerHTML=bubbles()+stageHTML(q)+`<div class="cover" id="cover"><b>👀</b>点一下</div>`;
    $("#cover").onclick=()=>{$("#cover").remove();placeSea(q);tone(520,.1);
      setTimeout(()=>{const s=$("#sea");if(s)s.innerHTML=`<div class="cover"><b>🌊</b></div>`;$("#pad").style.pointerEvents="";say(q.sayT,()=>{if(!q.t0)q.t0=Date.now()});setTimeout(()=>{if(!q.t0)q.t0=Date.now()},2500)},2000)};
    say("海里的朋友要出来了，看准哦！");return;
  }
  $("#pad").style.pointerEvents="";
  st.innerHTML=stageHTML(q,false);
  say(q.sayT,()=>{if(!q.t0)q.t0=Date.now()});
  setTimeout(()=>{if(!q.t0)q.t0=Date.now()},3000);
}
$("#again").addEventListener("click",()=>{const q=B&&B.qs[B.i];if(q)say(q.sayT)});

/* 打中：剑光 + 掉血数字；暴击：全屏闪光、光芒、大字、火花、震屏 */
function hitFx(crit){
  const bb=$("#bBoss"),r=bb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const s=document.createElement("div");s.className="slash";s.style.left=(cx-110)+"px";s.style.top=(cy-110)+"px";
  s.innerHTML=`<svg viewBox="0 0 100 100"><path d="M10 80 Q50 50 92 12 Q58 56 14 86Z" fill="#fff" stroke="${crit?"#FFD23F":"#9FE0FF"}" stroke-width="4"/></svg>`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),500);
  const d=document.createElement("div");d.className="dmg";d.textContent=crit?"-2":"-1";d.style.left=(cx+20)+"px";d.style.top=(cy-30)+"px";if(crit){d.style.fontSize="64px";d.style.color="#FFE14D"}
  document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
  bb.classList.remove("hurt");void bb.offsetWidth;bb.classList.add("hurt");
  if(!crit)return;
  const o=document.createElement("div");o.className="critfx";
  o.innerHTML=`<div class="flash"></div><div class="rays"></div>`+rep(i=>{const a=i/16*Math.PI*2,dist=260+rnd(200);return`<i class="spark" style="--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px;background:${pick(["#FFD23F","#FF7A3D","#fff","#7FE3FF"])}"></i>`},16)+`<div class="word">暴击！</div>`;
  document.body.appendChild(o);setTimeout(()=>o.remove(),1150);
  const sc=$("#battle");sc.classList.remove("shake");void sc.offsetWidth;sc.classList.add("shake");
}
$("#pad").addEventListener("click",e=>{
  const btn=e.target.closest("button");if(!btn||!B)return;const q=B.qs[B.i];if(q.done)return;
  const v=+btn.dataset.v;q.tries++;
  if(v===q.ans){
    q.done=true;btn.classList.add("ok");
    const secs=q.t0?(Date.now()-q.t0)/1000:0;
    const res=q.tries>1?"w":secs<=3?"f":"s";
    record(q.k,res);if(res==="f")B.fast++;else if(res==="s")B.slow++;else B.wrong++;
    if(q.mode==="flash"){$("#stage").innerHTML=bubbles()+stageHTML(q);placeSea(q)}else $("#stage").innerHTML=stageHTML(q,true);
    const crit=res==="f";hitFx(crit);crit?sndCrit():sndHit();
    $("#fb").className="fb ok";$("#fb").innerHTML=crit?"⚡ 暴击！":"✅ 打中了！";$("#fb").hidden=false;
    setTimeout(()=>say((crit?pick(["暴击！","闪电反应！","一口就说出来了！"]):pick(["打中了！","好样的！","答对了！"]))+sentenceOf(q)),crit?650:150);
    B.i++;hpDraw();
    $("#nextBtn").textContent=B.i<B.qs.length?"下一题 ›":"🎤 最后一招 ›";$("#nextBtn").hidden=false;
  }else{
    btn.classList.add("no");sndNo();
    $("#fb").className="fb no";$("#fb").textContent="🤔 再想想！";$("#fb").hidden=false;
    say("差一点！"+q.tip.replace(/\s/g,""));
    if(q.tries>=2){if(q.mode==="flash"){$("#stage").innerHTML=bubbles()+stageHTML(q);placeSea(q)}else $("#stage").innerHTML=stageHTML(q,true)}
  }
});
function sentenceOf(q){
  if(q.mode==="flash")return`有${q.n}只！`;
  if(q.mode==="merge"||q.mode==="riddle")return`${q.a}和${q.b}合起来是${q.n}！`;
  return`${q.n}可以分成${q.a}和${q.b}！`;
}
$("#nextBtn").addEventListener("click",()=>{if(B.i<B.qs.length)ask();else startReverse()});
$("#quit").addEventListener("click",()=>{if(confirm("现在回家，这一仗就不算赢哦。确定吗？")){hush();drawHome();show("home")}});
$("#quit2").addEventListener("click",()=>{hush();drawHome();show("home")});

/* ---------- 你来出题：把小兵从兵营拖进左营、右营 ---------- */
let R=null;
function startReverse(){
  R={n:0,pos:[],phase:"pick"};show("rev");
  $("#fl").innerHTML=art("flag","#3B82F6");$("#fr").innerHTML=art("flag","#F28C28");
  const max=Math.max(4,B.lv.n);
  $("#revPick").innerHTML=Array.from({length:max-1},(_,i)=>`<button data-n="${i+2}">${i+2}</button>`).join("");
  $("#revPick").hidden=false;$("#field").hidden=true;$("#revQ").hidden=true;$("#revBar").innerHTML="";
  $("#revStep").textContent="派几个兵？👇";
  say(`最后一招！轮到${kid()}出题，考考爸爸妈妈！先选一个数，派几个兵？`);
}
$("#revPick").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;R.n=+b.dataset.n;R.pos=Array(R.n).fill("p");R.phase="drag";
  [...$("#revPick").children].forEach(x=>x.classList.toggle("on",x===b));sndPick();
  $("#field").hidden=false;$("#revStep").textContent="把小兵拖到左边、右边 👆";
  say(`${R.n}个兵来了！用手指把小兵拖到左边营和右边营。`);
  drawField();
});
function drawField(){
  for(const z of["l","p","r"]){
    const el=document.querySelector(`.slots[data-z="${z}"]`);
    el.innerHTML=R.pos.map((p,i)=>p===z?`<div class="fig" data-i="${i}">${art("bing",z==="r"?"#F28C28":z==="l"?"#3B82F6":"#8A93A8")}</div>`:"").join("");
  }
  const zr=$("#zr");zr.querySelector(".tentcover")?.remove();zr.querySelector(".slots").style.visibility=R.phase==="closed"?"hidden":"";
  if(R.phase==="closed")zr.insertAdjacentHTML("beforeend",`<div class="tentcover pop"><div class="t">${art("tent")}</div><b>?</b></div>`);
  const L=R.pos.filter(p=>p==="l").length,Rr=R.pos.filter(p=>p==="r").length,P=R.pos.filter(p=>p==="p").length;
  if(R.phase==="drag"){
    $("#revBar").innerHTML=P===0&&L>0&&Rr>0?`<button class="b-go" id="closeT">⛺ 藏起来！</button>`:"";
    $("#revQ").hidden=true;
  }
}
/* 拖拽 */
let drag=null;
document.addEventListener("pointerdown",e=>{
  if(!R||R.phase!=="drag")return;const f=e.target.closest(".zone .fig");if(!f)return;
  e.preventDefault();
  drag={i:+f.dataset.i,x0:e.clientX,y0:e.clientY,moved:false,el:null,src:f};
  sndPick();
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){
    drag.moved=true;drag.el=document.createElement("div");drag.el.className="ghost";drag.el.innerHTML=art("bing","#8A93A8");document.body.appendChild(drag.el);drag.src.style.opacity=".25";
  }
  if(drag.moved){drag.el.style.left=e.clientX+"px";drag.el.style.top=e.clientY+"px";
    document.querySelectorAll(".zone").forEach(z=>z.classList.remove("hot"));
    const z=zoneAt(e.clientX,e.clientY);if(z)z.classList.add("hot")}
});
function zoneAt(x,y){for(const z of document.querySelectorAll(".zone")){const r=z.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return z}return null}
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;
  document.querySelectorAll(".zone").forEach(z=>z.classList.remove("hot"));
  if(d.el)d.el.remove();
  let to=null;
  if(d.moved){const z=zoneAt(e.clientX,e.clientY);if(z)to=z.id==="zl"?"l":z.id==="zr"?"r":"p"}
  else{const cur=R.pos[d.i];to=cur==="p"?"l":cur==="l"?"r":"p"}  /* 只点一下：兵营→左→右→兵营 */
  if(to&&to!==R.pos[d.i]){R.pos[d.i]=to;sndDrop()}
  drawField();
}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
$("#revBar").addEventListener("click",e=>{
  const id=e.target.closest("button")?.id;if(!id)return;
  const L=R.pos.filter(p=>p==="l").length,Rr=R.n-L;
  if(id==="closeT"){
    R.phase="closed";drawField();tone(300,.2,"triangle",.1);noise(.25,.12,0,600);
    $("#revStep").textContent="考考爸爸妈妈！";
    $("#revQ").hidden=false;$("#revQ").textContent=`⛺ 里有几个？`;
    $("#revBar").innerHTML=`<button class="b-go" id="openT">⛺ 打开看看</button>`;
    say(`爸爸妈妈，一共${R.n}个兵，左边${L}个，帐篷里藏了几个？快回答！`);
  }else if(id==="openT"){
    R.phase="open";drawField();sndDrop();
    $("#revQ").textContent=`⛺ 里有 ${Rr} 个！`;
    $("#revBar").innerHTML=`<button class="b-y" id="jy">✅ 对</button><button class="b-n" id="jn">❌ 错</button>`;
    say(`帐篷里有${Rr}个！爸爸妈妈答对了吗？`);
  }else if(id==="jy"||id==="jn"){
    if(id==="jy"){sndHit();say(`爸爸妈妈答对了！${R.n}可以分成${L}和${Rr}。${kid()}出的题真棒！`)}
    else{sndNo();say(`哈哈，爸爸妈妈答错啦！${kid()}快告诉他们，${R.n}可以分成${L}和${Rr}！`)}
    $("#revStep").textContent=id==="jy"?"爸爸妈妈答对了 👍":"哈哈，答错啦 😆";
    $("#revBar").innerHTML=`<button class="b-go" id="finish">⚔️ 打败${B.lv.name}！</button>`;
  }else if(id==="finish")finish();
});

/* ---------- 胜利 ---------- */
function confetti(){for(let i=0;i<60;i++){const c=document.createElement("i");c.className="confetti";c.style.left=rnd(100)+"vw";c.style.background=pick(["#FFD23F","#FF7A3D","#3B82F6","#22B573","#E23B3B","#A98BFF"]);c.style.animationDelay=(Math.random()*.8)+"s";c.style.animationDuration=(2+Math.random()*1.4)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}
function finish(){
  const lv=B.lv;
  const today=new Date().toDateString();if(!days.includes(today)){days.push(today);save("days",days)}
  const own=CARDS.find(c=>c[1]===lv.name&&!cards.includes(c[1]));
  const left=CARDS.filter(c=>!cards.includes(c[1]));
  const c=own||(left.length?pick(left):pick(CARDS));
  if(!cards.includes(c[1])){cards.push(c[1]);save("cards",cards)}
  $("#wBoss").innerHTML=art(lv.art);$("#wTitle").textContent=`打败了${lv.name}！`;
  $("#wStats").innerHTML=`<div>⚡ ${B.fast}</div><div>✅ ${B.slow}</div><div>🔁 ${B.wrong}</div>`;
  $("#wCard").innerHTML=`<div class="pic">${art(c[0])}</div><b>${c[1]}</b>`;
  const nx=focusLevel();
  $("#wTeaser").innerHTML=`明天：<span class="pic">${art(nx.art)}</span>${nx.name}`;
  show("win");
  const wb=$("#wBoss");wb.style.animation="none";void wb.offsetWidth;wb.style.animation="";
  sndWin();confetti();
  say(`太厉害了！打败了${lv.name}！${kid()}得到一张${c[1]}卡片！`);
}
$("#wHome").addEventListener("click",()=>{hush();drawHome();show("home")});

drawHome();
if(!KID)askName();
</script>
